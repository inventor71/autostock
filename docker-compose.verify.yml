# F10 verification harness — runs typecheck / unit / smoke against a TEST paper account,
# with ZERO production impact. The production systemd daemon, prod `.env`, and prod account are
# never referenced here: the container loads `.env.test` only (AUTOSTOCK_ENV_FILE override).
#
# Run FROM the worktree dir so `.:/app` mounts THIS worktree's code (not main):
#   docker compose -f docker-compose.verify.yml build
#   docker compose -f docker-compose.verify.yml run --rm verify typecheck
#   docker compose -f docker-compose.verify.yml run --rm verify unit
#   docker compose -f docker-compose.verify.yml run --rm verify smoke
#
# F15 — the `attach` service runs the FULL runtime (daemon + console TUI) for a human to watch the
# live sidebar, on the TEST paper account (prod-identical except the account). Interactive:
#   docker compose -f docker-compose.verify.yml run --rm -it attach
services:
  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /app
    # The actual code under test — bind-mounted so we verify the live worktree, not a baked copy.
    volumes:
      - .:/app
      # Real claude login (subscription) reused read-only — the real-LLM path, no API key, no stub.
      # If the claude CLI needs to WRITE session/cache state and errors on :ro, see state.md gotcha
      # (switch to :rw or set CLAUDE_CONFIG_DIR to a writable copy).
      - ${HOME}/.claude:/root/.claude:ro
      # Keep node_modules off the bind mount so host/container arch never clash and installs cache.
      - verify-node-modules:/app/operator-console/cli/node_modules
      # F22: mcp-server.ts lives at operator-console/src/ and imports from
      # @modelcontextprotocol/sdk (declared in operator-console/package.json).
      # Mask its node_modules too so bun install doesn't write root-owned files
      # onto the bind mount (same reason as cli/node_modules above).
      - mcp-node-modules:/app/operator-console/node_modules
    # NOTE: we deliberately do NOT use `env_file: [.env.test]`. pydantic-settings already loads
    # .env.test directly via AUTOSTOCK_ENV_FILE (config.py model_config) and the app reads creds ONLY
    # through Settings (no raw os.environ['ALPACA_*'] anywhere). Injecting the file as OS env too would
    # make OS env the authoritative source (pydantic precedence: env > dotenv) — a footgun if a host
    # ALPACA_* ever leaked in. The dotenv file stays the single source of truth; verify.sh preflight
    # asserts AUTOSTOCK_ENV_FILE is set + the file exists (else config.py falls back to prod /app/.env).
    environment:
      AUTOSTOCK_ENV_FILE: /app/.env.test
      PYTHONPATH: /app
      # Keep the container (runs as root) from writing scratch INTO the bind-mounted worktree —
      # else pytest/hypothesis/bytecode caches land as root:root and the host can't `git worktree
      # remove` without sudo. Redirect every writer off /app: no .pyc, hypothesis DB → /tmp.
      PYTHONDONTWRITEBYTECODE: "1"
      HYPOTHESIS_STORAGE_DIRECTORY: /tmp/hypothesis
    # mode is passed as the run arg → scripts/verify.sh (ENTRYPOINT). Default when omitted:
    command: ["all"]

  # F15 — full-runtime attach: daemon + console TUI on the TEST paper account, for a human to watch
  # the live sidebar. Same wiring as prod EXCEPT the account (and no systemd — daemon is a plain bg
  # process). Run interactively (the -it gives the TUI a terminal):
  #   docker compose -f docker-compose.verify.yml run --rm -it attach
  attach:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /app
    # Interactive: the console TUI needs a real terminal. (`run -it` also sets these; kept explicit.)
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      # rw — UNLIKE smoke's :ro. Live LLM turns (the daemon's agent) write session/cache state under
      # ~/.claude; a :ro mount makes the claude CLI error. This matches how the prod daemon uses it.
      - ${HOME}/.claude:/root/.claude:rw
      - verify-node-modules:/app/operator-console/cli/node_modules
      # F22: mcp-server.ts lives at operator-console/src/ and imports from
      # @modelcontextprotocol/sdk (declared in operator-console/package.json).
      # Mask its node_modules too so bun install doesn't write root-owned files
      # onto the bind mount (same reason as cli/node_modules above).
      - mcp-node-modules:/app/operator-console/node_modules
      # Daemon runtime writes → named volumes (NOT the bind mount), so nothing root-owned lands in the
      # worktree and the host can still `git worktree remove` without sudo. snapshot.json lives in the
      # steering volume, which the console reads via STEERING_DIR=/app/steering.
      - attach-steering:/app/steering
      - attach-workspace:/app/workspace
      - attach-logs:/app/logs
      # F25: give the container the HOST timezone so the timeline TUI (which runs
      # IN the container and uses `new Date()` = container-local tz) shows the
      # operator's local time, not UTC. Without this the now-cursor + tick labels
      # are off by the UTC offset (e.g. 20:12 KST rendered as 11:12).
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Same fail-closed isolation as `verify` (preflight asserts these): TEST account only.
      AUTOSTOCK_ENV_FILE: /app/.env.test
      PYTHONPATH: /app
      STEERING_DIR: /app/steering
      PYTHONDONTWRITEBYTECODE: "1"
      # F18: the opencode console MCP config (operator-console/cli/.opencode/opencode.jsonc)
      # substitutes {env:AUTOSTOCK_ROOT} (the mcp-server.ts command path) and
      # {env:STEERING_OPERATOR_TOKEN} (the shared daemon<->console secret, runtime.py honours
      # os.environ[STEERING_OPERATOR_TOKEN]). Without these the MCP command resolved to
      # /operator-console/... (not /app/...) so the server never started in-container -> the
      # console's order tools were absent in `attach`. Host-overridable; the TEST-only default
      # makes the in-container daemon + console share ONE token (container is the TEST paper
      # account only — preflight forbids prod .env, so this fixed token is never a prod secret).
      AUTOSTOCK_ROOT: /app
      STEERING_OPERATOR_TOKEN: ${STEERING_OPERATOR_TOKEN:-attach-test-token}
      # F20/F22: Alpaca keys NOT injected as OS env — the Python daemon reads .env (copied from
      # .env.test by verify.sh), and the TS MCP server falls back to reading .env when OS env
      # vars are absent. Injecting ALPACA_API_KEY as OS env (even empty) would override .env
      # values via pydantic's OS-env > dotenv precedence and cause "unauthorized" in the daemon.
      ALPACA_PAPER: ${ALPACA_PAPER:-true}
    command: ["attach"]

  # F25: seed the attach workspace volume with synthetic turns + interventions so
  # the timeline bar can be exercised (3 market regions, edge-clamped off-window
  # markers, human markers) without waiting for a live session. Run BEFORE attach:
  #   docker compose -f docker-compose.verify.yml run --rm seed-timeline
  #   docker compose -f docker-compose.verify.yml run --rm seed-timeline --date 2026-06-04
  # then start `attach` and navigate the timeline to the seeded date.
  seed-timeline:
    build:
      context: .
      dockerfile: Dockerfile.verify
    working_dir: /app
    volumes:
      - .:/app
      - attach-workspace:/app/workspace
    environment:
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: "1"
    entrypoint: ["python", "-u", "scripts/gen_test_timeline.py", "--workspace", "/app/workspace"]
    command: []

volumes:
  verify-node-modules:
  mcp-node-modules:
  attach-steering:
  attach-workspace:
  attach-logs:
