# F10 verification harness — runs typecheck / unit / smoke against a TEST paper account,
# with ZERO production impact. The production systemd daemon, prod `.env`, and prod account are
# never referenced here: the container loads `.env.test` only (AUTOSTOCK_ENV_FILE override).
#
# F27 — ALWAYS invoke via scripts/verify-run.sh (NOT raw `docker compose`): it exports the host
# DOCKER_UID/DOCKER_GID the `user:` keys below require (they fail-loud if unset) and runs the
# one-shot `init-perms` volume chown. Run FROM the worktree dir so `.:/app` mounts THIS worktree:
#   scripts/verify-run.sh build
#   scripts/verify-run.sh run --rm verify typecheck
#   scripts/verify-run.sh run --rm verify unit
#   scripts/verify-run.sh run --rm verify smoke
#
# F15 — the `attach` service runs the FULL runtime (daemon + console TUI) for a human to watch the
# live sidebar, on the TEST paper account (prod-identical except the account). Interactive:
#   scripts/verify-run.sh run --rm -it attach
services:
  # F27 (G-7): named volumes are created owned root:root, so the non-root verify/attach containers
  # can't write into them (bun install → EACCES). This one-shot helper is the ONLY service without
  # `user:` (so it runs as root) and chowns the volume mountpoints to the host UID:GID before the
  # real run. verify-run.sh invokes it for run/up. It mounts the volumes at neutral /v/* paths (no
  # /app bind), so the chown is deterministic and not shadowed by the bind mount.
  init-perms:
    build:
      context: .
      dockerfile: Dockerfile.verify
    # Shared image name (NOT project-namespaced) so the ~8G deps image is built ONCE and reused by
    # every worktree — without this, each compose project (= worktree dir) rebuilds its own image
    # from scratch (a silent multi-minute bun install). Build once: scripts/verify-run.sh build.
    image: autostock-verify:latest
    volumes:
      - verify-node-modules:/v/cli-node-modules
      - mcp-node-modules:/v/mcp-node-modules
      - attach-steering:/v/steering
      - attach-workspace:/v/workspace
      - attach-logs:/v/logs
    entrypoint: ["sh", "-c", "chown ${DOCKER_UID:-0}:${DOCKER_GID:-0} /v/cli-node-modules /v/mcp-node-modules /v/steering /v/workspace /v/logs"]
    command: []

  verify:
    build:
      context: .
      dockerfile: Dockerfile.verify
    # Shared image name (NOT project-namespaced) so the ~8G deps image is built ONCE and reused by
    # every worktree — without this, each compose project (= worktree dir) rebuilds its own image
    # from scratch (a silent multi-minute bun install). Build once: scripts/verify-run.sh build.
    image: autostock-verify:latest
    working_dir: /app
    # F27: run as the HOST user so bind-mount writes are host-owned (no sudo to `git worktree
    # remove`). fail-loud (`:?`) — a raw `docker compose` bypassing verify-run.sh errors clearly
    # instead of silently falling back to a wrong UID that can't read the 0600 ~/.claude creds.
    user: "${DOCKER_UID:?run via scripts/verify-run.sh}:${DOCKER_GID:?run via scripts/verify-run.sh}"
    # The actual code under test — bind-mounted so we verify the live worktree, not a baked copy.
    volumes:
      - .:/app
      # Real claude login (subscription) reused read-only — the real-LLM path, no API key, no stub.
      # F27: mounted at /tmp/.claude (HOME=/tmp below) because an arbitrary host UID has no passwd
      # entry → ~ would be / (unwritable). NOTE: ~/.claude.json (auth state) lives at HOME ROOT and
      # is NOT mounted — same as the prior /root setup; if attach's real LLM turns fail auth, also
      # mount ${HOME}/.claude.json or set CLAUDE_CONFIG_DIR (see infra-design.md G-1).
      - ${HOME}/.claude:/tmp/.claude:ro
      # Keep node_modules off the bind mount so host/container arch never clash and installs cache.
      - verify-node-modules:/app/operator-console/cli/node_modules
      # F22: mcp-server.ts lives at operator-console/src/ and imports from
      # @modelcontextprotocol/sdk (declared in operator-console/package.json).
      # Mask its node_modules too so bun install doesn't write root-owned files
      # onto the bind mount (same reason as cli/node_modules above).
      - mcp-node-modules:/app/operator-console/node_modules
    # NOTE: we deliberately do NOT use `env_file: [.env.test]`. pydantic-settings already loads
    # .env.test directly via AUTOSTOCK_ENV_FILE (config.py model_config) and the app reads creds ONLY
    # through Settings (no raw os.environ['ALPACA_*'] anywhere). Injecting the file as OS env too would
    # make OS env the authoritative source (pydantic precedence: env > dotenv) — a footgun if a host
    # ALPACA_* ever leaked in. The dotenv file stays the single source of truth; verify.sh preflight
    # asserts AUTOSTOCK_ENV_FILE is set + the file exists (else config.py falls back to prod /app/.env).
    environment:
      AUTOSTOCK_ENV_FILE: /app/.env.test
      PYTHONPATH: /app
      # F27: arbitrary host UID has no passwd entry, so set HOME explicitly to a world-writable dir
      # (/tmp is 1777) — claude reads /tmp/.claude (mounted above) and bun caches under /tmp/.bun.
      HOME: /tmp
      # Belt-and-suspenders: keep scratch off the bind mount anyway (smaller diff for the host).
      # No .pyc; hypothesis DB → /tmp. (Host-owned now, but tidiness still helps.)
      PYTHONDONTWRITEBYTECODE: "1"
      HYPOTHESIS_STORAGE_DIRECTORY: /tmp/hypothesis
    # mode is passed as the run arg → scripts/verify.sh (ENTRYPOINT). Default when omitted:
    command: ["all"]

  # F15 — full-runtime attach: daemon + console TUI on the TEST paper account, for a human to watch
  # the live sidebar. Same wiring as prod EXCEPT the account (and no systemd — daemon is a plain bg
  # process). Run interactively (the -it gives the TUI a terminal):
  #   docker compose -f docker-compose.verify.yml run --rm -it attach
  attach:
    build:
      context: .
      dockerfile: Dockerfile.verify
    # Shared image name (NOT project-namespaced) so the ~8G deps image is built ONCE and reused by
    # every worktree — without this, each compose project (= worktree dir) rebuilds its own image
    # from scratch (a silent multi-minute bun install). Build once: scripts/verify-run.sh build.
    image: autostock-verify:latest
    working_dir: /app
    # F27: run as the HOST user (see verify service). fail-loud if DOCKER_UID/GID unset.
    user: "${DOCKER_UID:?run via scripts/verify-run.sh}:${DOCKER_GID:?run via scripts/verify-run.sh}"
    # Interactive: the console TUI needs a real terminal. (`run -it` also sets these; kept explicit.)
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      # rw — UNLIKE smoke's :ro. Live LLM turns (the daemon's agent) write session/cache state under
      # ~/.claude; a :ro mount makes the claude CLI error. This matches how the prod daemon uses it.
      # F27: /tmp/.claude (HOME=/tmp). ~/.claude.json (auth) is NOT mounted (pre-existing); if the
      # daemon's LLM turns fail to authenticate, add `- ${HOME}/.claude.json:/tmp/.claude.json:rw`
      # here (note :rw would let the container mutate your host claude config) — see infra-design G-1.
      - ${HOME}/.claude:/tmp/.claude:rw
      - verify-node-modules:/app/operator-console/cli/node_modules
      # F22: mcp-server.ts lives at operator-console/src/ and imports from
      # @modelcontextprotocol/sdk (declared in operator-console/package.json).
      # Mask its node_modules too so bun install doesn't write root-owned files
      # onto the bind mount (same reason as cli/node_modules above).
      - mcp-node-modules:/app/operator-console/node_modules
      # Daemon runtime writes → named volumes (NOT the bind mount), so nothing root-owned lands in the
      # worktree and the host can still `git worktree remove` without sudo. snapshot.json lives in the
      # steering volume, which the console reads via STEERING_DIR=/app/steering.
      - attach-steering:/app/steering
      - attach-workspace:/app/workspace
      - attach-logs:/app/logs
      # F25: give the container the HOST timezone so the timeline TUI (which runs
      # IN the container and uses `new Date()` = container-local tz) shows the
      # operator's local time, not UTC. Without this the now-cursor + tick labels
      # are off by the UTC offset (e.g. 20:12 KST rendered as 11:12).
      - /etc/localtime:/etc/localtime:ro
    environment:
      # Same fail-closed isolation as `verify` (preflight asserts these): TEST account only.
      AUTOSTOCK_ENV_FILE: /app/.env.test
      PYTHONPATH: /app
      # F27: HOME for the non-root user (claude/bun writes). The daemon spawns `claude` inheriting
      # this HOME (src/strategy/llm/client.py runs subprocess with no env override).
      HOME: /tmp
      STEERING_DIR: /app/steering
      # F25: Bun (the TUI runtime) reads the TZ env var, NOT /etc/localtime, and
      # ships its own tzdata — so an IANA name here makes the timeline show the
      # operator's local time instead of the container's UTC (20:12 KST was being
      # rendered as 11:12). Defaults to Asia/Seoul; override with host TZ if elsewhere.
      TZ: ${TZ:-Asia/Seoul}
      PYTHONDONTWRITEBYTECODE: "1"
      # F26: match the launcher's actual runtime env — lockdown must be on in ALL profiles
      # so the operator console never exposes write/exec builtins to the agent. Without this,
      # attach had all tools (edit/write/bash/task) available — a worse permission surface than
      # the real launcher. Supervisor env-var (AUTOSTOCK_SUPERVISOR=on) can be injected by the
      # host or by verify.sh for testing supervisor mode in the container.
      AUTOSTOCK_LOCKDOWN: "on"
      # F26: pass through from the host to test supervisor mode.
      #   AUTOSTOCK_SUPERVISOR=on scripts/verify-run.sh run --rm -it attach
      # Normal (empty) → source reads blocked; on → full /app read except secrets.
      AUTOSTOCK_SUPERVISOR: ${AUTOSTOCK_SUPERVISOR:-}
      # F18: the opencode console MCP config (operator-console/cli/.opencode/opencode.jsonc)
      # substitutes {env:AUTOSTOCK_ROOT} (the mcp-server.ts command path) and
      # {env:STEERING_OPERATOR_TOKEN} (the shared daemon<->console secret, runtime.py honours
      # os.environ[STEERING_OPERATOR_TOKEN]). Without these the MCP command resolved to
      # /operator-console/... (not /app/...) so the server never started in-container -> the
      # console's order tools were absent in `attach`. Host-overridable; the TEST-only default
      # makes the in-container daemon + console share ONE token (container is the TEST paper
      # account only — preflight forbids prod .env, so this fixed token is never a prod secret).
      AUTOSTOCK_ROOT: /app
      STEERING_OPERATOR_TOKEN: ${STEERING_OPERATOR_TOKEN:-attach-test-token}
      # F20/F22: Alpaca keys NOT injected as OS env — the Python daemon reads .env (copied from
      # .env.test by verify.sh), and the TS MCP server falls back to reading .env when OS env
      # vars are absent. Injecting ALPACA_API_KEY as OS env (even empty) would override .env
      # values via pydantic's OS-env > dotenv precedence and cause "unauthorized" in the daemon.
      ALPACA_PAPER: ${ALPACA_PAPER:-true}
    command: ["attach"]

  # F25: seed the attach workspace volume with synthetic turns + interventions so
  # the timeline bar can be exercised (3 market regions, edge-clamped off-window
  # markers, human markers) without waiting for a live session. Run BEFORE attach:
  #   docker compose -f docker-compose.verify.yml run --rm seed-timeline
  #   docker compose -f docker-compose.verify.yml run --rm seed-timeline --date 2026-06-04
  # then start `attach` and navigate the timeline to the seeded date.
  seed-timeline:
    build:
      context: .
      dockerfile: Dockerfile.verify
    # Shared image name (NOT project-namespaced) so the ~8G deps image is built ONCE and reused by
    # every worktree — without this, each compose project (= worktree dir) rebuilds its own image
    # from scratch (a silent multi-minute bun install). Build once: scripts/verify-run.sh build.
    image: autostock-verify:latest
    working_dir: /app
    # F27: host user so the seeded workspace volume files are host-owned (init-perms chowns the
    # volume first). fail-loud if run outside verify-run.sh.
    user: "${DOCKER_UID:?run via scripts/verify-run.sh}:${DOCKER_GID:?run via scripts/verify-run.sh}"
    volumes:
      - .:/app
      - attach-workspace:/app/workspace
    environment:
      PYTHONPATH: /app
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    entrypoint: ["python", "-u", "scripts/gen_test_timeline.py", "--workspace", "/app/workspace"]
    command: []

volumes:
  # Dependency volumes — FIXED names so they are SHARED across all worktrees/compose projects (one
  # ~2.8G copy total, not one per worktree). A runtime `bun install` (verify.sh, as the host user)
  # populates them on the first run and is fast afterward (warm store). `external` so compose treats
  # them as shared/pre-existing (no per-project ownership warning); verify-run.sh `docker volume
  # create`s them if missing and init-perms chowns them to the host UID so the install can write.
  # Safe to share: the console SOURCE is per-worktree (bind mount); only third-party deps are shared,
  # and bun's per-package workspace symlinks are (re)created per worktree under each worktree's /app.
  verify-node-modules:
    name: autostock-verify-cli-node-modules
    external: true
  mcp-node-modules:
    name: autostock-verify-mcp-node-modules
    external: true
  # Runtime-state volumes — NO fixed name → project-namespaced (= per-worktree dir), so independent
  # parallel experiments never share journal/snapshot/logs.
  attach-steering:
  attach-workspace:
  attach-logs:
