active_strategies:
  - llm

strategies:
  buy_and_hold:
    class: BuyAndHoldStrategy
    params: {}

  ma_crossover:
    class: MovingAverageCrossover
    params:
      fast_period: 20
      slow_period: 50
      signal_threshold: 0.0

  rsi:
    class: RSIStrategy
    params:
      period: 14
      overbought: 70
      oversold: 30

  macd:
    class: MACDStrategy
    params:
      fast_period: 12
      slow_period: 26
      signal_period: 9

  bollinger:
    class: BollingerBandsStrategy
    params:
      period: 20
      num_std: 2.0

  llm:
    class: LLMStrategy
    params:
      provider: claude_code      # claude or openai or claude_code
      prompt_version: latest     # latest, best, v1, v2, etc.
      lookback_days: 30
      include_news: true
      temperature: 0.3

ensemble:
  type: weighted  # voting, weighted
  strategies:
    - name: ma_crossover
      weight: 0.4
    - name: rsi
      weight: 0.3
    - name: macd
      weight: 0.3
  min_agreement: 0.6  # For voting ensemble
