active_strategies:
  - ma_crossover

strategies:
  ma_crossover:
    class: MovingAverageCrossover
    params:
      fast_period: 20
      slow_period: 50
      signal_threshold: 0.0

  rsi:
    class: RSIStrategy
    params:
      period: 14
      overbought: 70
      oversold: 30

  macd:
    class: MACDStrategy
    params:
      fast_period: 12
      slow_period: 26
      signal_period: 9

  bollinger:
    class: BollingerBandsStrategy
    params:
      period: 20
      num_std: 2.0

  random_forest:
    class: RandomForestStrategy
    params:
      n_estimators: 100
      lookback_period: 60
      feature_window: 20
      retrain_interval_days: 30
      model_path: ./models/rf_model.pkl

  lstm:
    class: LSTMStrategy
    params:
      sequence_length: 60
      hidden_size: 128
      num_layers: 2
      dropout: 0.2
      model_path: ./models/lstm_model.pt

  llm:
    class: LLMStrategy
    params:
      provider: claude           # claude or openai
      prompt_version: latest     # latest, best, v1, v2, etc.
      lookback_days: 30
      include_news: true
      temperature: 0.3

ensemble:
  type: weighted  # voting, weighted
  strategies:
    - name: ma_crossover
      weight: 0.3
    - name: rsi
      weight: 0.2
    - name: macd
      weight: 0.2
    - name: random_forest
      weight: 0.3
  min_agreement: 0.6  # For voting ensemble
