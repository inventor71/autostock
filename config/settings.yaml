  # which symbols to trade from this universe via select_symbols() method.
  # Use --symbols CLI flag to override for testing with a subset.
  symbols:
    # Technology
    - AAPL
    - MSFT
    - GOOGL
    - GOOG
    - AMZN
    - NVDA
    - META
    - TSLA
    - AVGO
    - ORCL
    - ADBE
    - CRM
    - AMD
    - INTC
    - CSCO
    - QCOM
    - IBM
    - TXN
    - NOW
    - INTU
    # Finance
    - JPM
    - V
    - MA
    - BAC
    - WFC
    - GS
    - MS
    - BLK
    - SCHW
    - AXP
    - C
    - USB
    - PNC
    - TFC
    - COF
    # Healthcare
    - UNH
    - JNJ
    - LLY
    - PFE
    - ABBV
    - MRK
    - TMO
    - ABT
    - DHR
    - BMY
    - AMGN
