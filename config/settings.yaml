app:
  name: autostock
  mode: paper  # paper, live, backtest
  log_level: INFO

broker:
  name: alpaca
  paper: true
  # Which broker implementation to use:
  #   alpaca     → AlpacaBroker (Trading API, own paper account, ALPACA_API_KEY)
  #   account_farm → AccountFarmBroker (Broker API sandbox, BROKER_API_KEY + BROKER_ACCOUNT_ID)
  provider: alpaca
  # API keys should be set via environment variables:
  # ALPACA_API_KEY, ALPACA_API_SECRET (alpaca provider)
  # BROKER_API_KEY, BROKER_API_SECRET, BROKER_ACCOUNT_ID (account_farm provider)

data:
  provider: yfinance  # yfinance, alpaca
  cache_dir: ./data
  default_timeframe: 1d

trading:
  mode: batch  # batch, realtime
  batch_interval_minutes: 15

# Universe: the tradeable symbol pool is resolved dynamically per market (base ∪
# enabled themes), cached to config/universe/{market}_base.json with a snapshot
# fallback. US base = S&P 100; KR base = KIS market-cap top-N. --symbols overrides.
universe:
  market: us            # active market: us (Alpaca) | kr (KIS)
  top_n: 100            # US: keep top-N (optionally market-cap ranked)
  enabled_themes: []    # e.g. [반도체]
  themes:
    us: {}              # 반도체: [NVDA, AMD, AVGO, ...]
    kr: {}              # 반도체: ["005930", "000660", ...]

risk:
  max_position_pct: 0.05  # Max 5% of portfolio per position (more diversified)
  max_portfolio_risk: 0.02  # Max 2% daily portfolio risk
  stop_loss_pct: 0.05  # 5% stop loss
  take_profit_pct: 0.15  # 15% take profit
  max_open_positions: 20  # Allow more positions for diversification
  # Bracket / defense-in-depth (Phase R2), aggressive preset:
  max_stop_distance_pct: 0.12  # cap stop distance from entry (per-trade loss cap)
  atr_stop_multiple: 3.0  # default stop = 3x ATR when LLM gives no level
  market_halt_threshold_pct: -0.03  # halt new buys if SPY day-change <= -3%
  default_risk_reward: 2.5  # derived take-profit R:R when LLM gives no target
  # F60: master short on/off. Shipped OFF — long-only until you flip this to true.
  # false → every short entry (agent + /short + auto-flip) is rejected; covering an
  # existing short still works. Restart the daemon after changing.
  shorting_enabled: false
  # F54 short-selling risk (all optional; null/omitted → fall back to the long
  # value above). Shorts carry unbounded loss, so the stop is always mandatory.
  short_market_halt_threshold_pct: 0.03  # halt new shorts if SPY day-change >= +3%
  individual_stock_halt_pct: 0.10  # reject a fresh short if the name is up >=10% today
  short_stop_loss_pct: null  # null → use stop_loss_pct
  short_take_profit_pct: null  # null → use take_profit_pct
  short_max_stop_distance_pct: null  # null → use max_stop_distance_pct

backtest:
  start_date: "2020-01-01"
  end_date: "2025-01-01"
  initial_capital: 50000.0
  commission_pct: 0.0  # Alpaca is commission-free

monitoring:
  alerts_enabled: false
  slack_webhook: ""
  telegram_token: ""
  telegram_chat_id: ""

llm:
  provider: claude_code       # claude (API key) | openai (API key) | claude_code (CLI subscription, dev only)
  model: null                # null uses provider default (claude-sonnet-4-6 / gpt-4o / 'sonnet' for claude_code)
  temperature: 0.3           # Lower = more deterministic (ignored by claude_code)
  prompt_version: latest     # latest, best, v1, v2, etc.
  lookback_days: 30          # Days of historical data for context
  include_news: true         # Include news headlines in LLM context
  # API keys should be set via environment variables:
  # ANTHROPIC_API_KEY, OPENAI_API_KEY
  # claude_code needs no key -- it reuses the logged-in `claude` CLI session.

agent:
  model: sonnet
  research_model: opus
  turn_timeout: 600
  research_timeout: 1800
  research_start_before_open: 60   # start research N min before market open
  research_end_before_open: 5      # finish N min before open (hard deadline)
  experiment_start: "2026-05-27"
  min_trade_notional: 50.0

multi_agent:
  enabled: true
  mode: sequential       # sequential (Mode B) | parallel (Mode C)
  n_agents: 3            # [1,5]; enabled=true enforces >= 2

research:
  signals:
    - quote
    - indicators
    - fundamentals
    - news
    - scoreboard
    - earnings
    - insider
    - macro
    - analyst_upgrades
    - institutional
  reflection:
    enabled: true
    max_lessons_injected: 10

# F3 intraday redesign — event-driven wakes + structured brief (only active with
# --steering). All keys optional; omitted values fall back to the defaults shown.
intraday:
  abnormal_move:
    atr_k: 1.5          # wake when |intraday move| > atr_k * ATR(atr_period)
    vol_multiple: 3.0   # OR when last-bar volume > vol_multiple * average
    atr_period: 14
  wake:
    detect_seconds: 5   # cadence of the (cache-only) wake detector
    timeout: 300.0      # turn-level execution bound for a wake turn (lock-hold cap)
  news:
    ttl_minutes: 15.0   # news poll cadence (provider caches ~15min anyway)
  bars:
    cache_seconds: 60.0 # ATR/volume bar-input cache TTL
  price:
    cache_seconds: 3.0  # latest-price cache TTL (keeps the 5s detector non-blocking)

# F82: intraday feature auto-collection. On daemon start, gap-backfill each
# universe symbol's per-session features (data/intraday/<SYM>.parquet) in a
# background thread; after each close, append the day's session. Fills the
# IntradayFeatureStore that intraday pattern analysis consumes.
intraday_collection:
  enabled: true           # ON: backfill on start + append every EOD (set false to disable)
  backfill_years: 3       # initial deep-history depth (alpaca minute bars)
  provider: alpaca        # backfill source; yfinance caps at ~60d (degrades, no crash)
  timeframe: 5m           # bar interval for session features

# F47: EOD surge/dive detection. Scans the universe after market close and
# records stocks that moved beyond the threshold. The agent analyses each one
# during the EOD review turn.
surge:
  threshold_pct: 7.0      # absolute daily return to qualify as surge/dive (%)

# F61: research-turn market-signal collection. Scans universe + bellwether
# watchlist for movers, propagates big moves to related names via a static peer
# map (read-through), and surfaces imminent earnings. Pushed into the research
# prompt + exposed via the movers / readthrough / earnings_calendar tools.
signals:
  enabled: true
  # Mover thresholds (R1): a name qualifies if |chg| >= price_pct OR vol >= vol_ratio.
  price_pct: 5.0
  vol_ratio: 2.0
  require: any            # any | both
  max_movers: 12
  # Read-through (R2): only moves >= readthrough_min_pct propagate to peers.
  readthrough_min_pct: 7.0
  max_peers: 8
  # Earnings (R3): surface universe/held earnings within this many days.
  earnings_horizon_days: 2
  # Imminent IPOs / catalysts (F78): awareness channel, NOT universe-filtered.
  # Surface upcoming US IPOs within this horizon, size-ranked, capped at max_ipos.
  ipo_horizon_days: 5
  max_ipos: 8
  # Source toggles (R8).
  sources:
    news_primary: alpaca       # alpaca | yfinance
    news_fallback: yfinance    # yfinance | none
    earnings_provider: finnhub # finnhub | none
    ipo_provider: finnhub      # finnhub | none (F78)
  cache_ttl_seconds: 300
  http_connect_timeout: 3.0
  http_read_timeout: 5.0
  scan_timeout_seconds: 30.0   # aggregate cap on the price scan (NFR-2)
  # Retail sentiment (F77): hourly StockTwits sweep over the universe — author
  # self-labels (Bullish/Bearish) only, no bodies/usernames. The crowd rests
  # ~75% bullish, so only deviation vs a symbol's OWN baseline surfaces.
  sentiment:
    enabled: true
    sweep_minutes: 60
    window_et: ["04:00", "20:00"]  # sweep only during extended hours (ET)
    request_gap_s: 0.5             # pacing between symbol calls
    hourly_budget: 150             # hard cap/tick (unauth allowance ~200/hr)
    baseline_days: 5
    min_baseline_points: 12        # cold-start cut (~1 day of hourly sweeps)
    min_tagged: 8                  # small-sample cut on the current snapshot
    top_k: 5                       # max outliers surfaced in the brief
    z_threshold: 2.0
    max_age_minutes: 180           # stale 'current' (stopped sweep) never surfaces
  # Disclosed holdings (F81): institutional 13F → tradeable-universe overlay + brief.
  # Shipped OFF — long-only safe. Flip enabled:true (and restart the daemon) to run.
  # The daemon refresher does the only HTTP (every refresh_hours) and writes a
  # normalized snapshot per source to workspace/holdings/; the universe overlay and
  # the research brief read that cache (no HTTP on the turn/universe path).
  disclosed_holdings:
    enabled: true
    refresh_hours: 24              # 13F is quarterly; cadence only catches new filings
    max_age_days: 135              # drop a filing older than ~1 quarter + 45d lag
    brief_top_n: 6                 # names per side shown in the brief
    # SEC fair-access REQUIRES an identifying User-Agent with a real contact.
    user_agent: "autostock/1.0 (contact: dice.jihoonpark@gmail.com)"
    request_gap_s: 0.5
    providers:
      # LONG holdings → universe long candidates; PUT/short-side → universe short
      # candidates ONLY when risk.shorting_enabled (else brief-only). overlay:false
      # makes a source brief-only (never touches the tradeable universe).
      - { type: sec_13f, cik: "0002045724", manager_name: "Situational Awareness LP", overlay: true }
  # Bellwether watchlist (R7): signal-only sources, never tradeable. SPY/QQQ/IWM/
  # DIA/VTI are already in the universe; these add sector ETFs.
  bellwether_watchlist: [SMH, SOXX, XLK, XLF, XLE, XLV, XLY, XLP, XLI]
  # Static peer map (R6): group -> members. A symbol may belong to several groups;
  # peers_of(sym) = union of co-members across its groups, minus itself.
  # Bellwether ETFs are listed as members of their sector group so a move in the
  # ETF reads through to that sector's tradeable names (the ETF itself is dropped
  # from affected_peers — not in the universe). EVERY bellwether_watchlist entry
  # must appear in some group, else it can never trigger read-through
  # (guarded by tests/signals/test_config_seed.py).
  peer_groups:
    semiconductors:    [NVDA, AMD, AVGO, QCOM, TXN, INTC, MU, MRVL, ARM, TSM, ADI, MPWR, RMBS, SMH, SOXX]
    semicap_equipment: [AMAT, LRCX, KLAC, ASML, TER]
    memory_storage:    [MU, SNDK, WDC, STX, RMBS]
    ai_networking:     [ANET, CIEN, COHR, LITE, MRVL, AVGO]
    ai_servers_odm:    [DELL, SMCI]
    ai_hyperscalers:   [MSFT, GOOGL, GOOG, AMZN, META, ORCL]
    datacenter_power:  [VRT, ETN, PWR, GEV, NVT, MOD, VST, CEG]
    datacenter_reit:   [DLR, EQIX, AMT, CCI, PLD]
    software_infra:    [NOW, CRM, ADBE, INTU, ORCL]
    megacap_tech:      [AAPL, MSFT, GOOGL, AMZN, META, NVDA, TSLA, XLK]
    banks:             [JPM, BAC, WFC, C, USB, PNC, TFC, COF, GS, MS, XLF]
    payments:          [V, MA, AXP]
    energy:            [XOM, CVX, COP, SLB, EOG, MPC, PSX, VLO, OXY, XLE]
    healthcare:        [UNH, JNJ, LLY, PFE, ABBV, MRK, TMO, ABT, DHR, BMY, AMGN, MDT, GILD, ISRG, CVS, XLV]
    consumer_disc:     [AMZN, TSLA, MCD, NKE, SBUX, TGT, LOW, HD, DIS, NFLX, XLY]
    consumer_staples:  [WMT, PG, KO, PEP, COST, XLP]
    industrials:       [CAT, DE, UPS, BA, HON, UNP, RTX, LMT, GE, MMM, XLI]
    ai_infra_broad:    [NVDA, AMD, AVGO, MRVL, ARM, AMAT, LRCX, KLAC, ANET, VRT, DELL, SMCI, MU]

# F70 shadow benchmark — deterministic baselines as a measuring stick.
# Runs each baseline on its own sandbox account and records equity alongside the
# live LLM account, so you can later extract "is the LLM beating a dumb floor?".
# Master toggle defaults OFF: with enabled=false nothing runs and the agent path
# is unchanged. To turn on, map each baseline to a distinct sandbox account_id
# (from scripts/broker_create_accounts.py) that is NOT the live broker_account_id.
benchmark:
  enabled: false
  baselines: [buy_and_hold, ma_crossover, rsi, macd, bollinger]
  accounts: {}                        # e.g. { buy_and_hold: "acct-id-1", rsi: "acct-id-2" }
  interval: eod                       # "eod" (daily) or an integer minute interval
  storage_dir: data/benchmark
  retention_days: 365

early_session:
  enabled: true                       # master switch
  threshold_pct: 5.0                  # ±% trigger (Q1=D)
  window_minutes: 10                  # detection lookback (minutes)
  dump_before_minutes: 15             # bars to dump BEFORE the trigger
  dump_after_minutes: 45              # bars to dump AFTER the trigger
  poll_interval_seconds: 30           # bar-fetch cadence
  buffer_retention_minutes: 75        # circular-buffer capacity (min) — must cover dump_before+dump_after+window (auto-raised if too small)
  monitor_start_et: "09:30"           # ET market-open
  monitor_end_et: "10:30"             # ET end of monitoring window
