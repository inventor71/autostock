app:
  name: autostock
  mode: paper  # paper, live, backtest
  log_level: INFO

broker:
  name: alpaca
  paper: true
  # API keys should be set via environment variables:
  # ALPACA_API_KEY, ALPACA_SECRET_KEY

data:
  provider: yfinance  # yfinance, alpaca
  cache_dir: ./data
  default_timeframe: 1d

trading:
  # Universe: Pool of tradeable symbols. Strategies can dynamically select
  # which symbols to trade from this universe via select_symbols() method.
  # Use --symbols CLI flag to override for testing with a subset.
  symbols:
    # Technology
    - AAPL
    - MSFT
    - GOOGL
    - GOOG
    - AMZN
    - NVDA
    - META
    - TSLA
    - AVGO
    - ORCL
    - ADBE
    - CRM
    - AMD
    - INTC
    - CSCO
    - QCOM
    - IBM
    - TXN
    - NOW
    - INTU
    # Finance
    - JPM
    - V
    - MA
    - BAC
    - WFC
    - GS
    - MS
    - BLK
    - SCHW
    - AXP
    - C
    - USB
    - PNC
    - TFC
    - COF
    # Healthcare
    - UNH
    - JNJ
    - LLY
    - PFE
    - ABBV
    - MRK
    - TMO
    - ABT
    - DHR
    - BMY
    - AMGN
    - MDT
    - GILD
    - ISRG
    - CVS
    # Consumer
    - WMT
    - PG
    - KO
    - PEP
    - COST
    - MCD
    - NKE
    - SBUX
    - TGT
    - LOW
    - HD
    - DIS
    - NFLX
    - CMCSA
    - VZ
    # Energy
    - XOM
    - CVX
    - COP
    - SLB
    - EOG
    - PXD
    - MPC
    - PSX
    - VLO
    - OXY
    # Industrial
    - CAT
    - DE
    - UPS
    - BA
    - HON
    - UNP
    - RTX
    - LMT
    - GE
    - MMM
    # Materials & Real Estate
    - LIN
    - APD
    - SHW
    - FCX
    - NEM
    - AMT
    - PLD
    - CCI
    - EQIX
    - SPG
    # ETFs
    - SPY
    - QQQ
    - IWM
    - DIA
    - VTI
  mode: batch  # batch, realtime
  batch_interval_minutes: 60

risk:
  max_position_pct: 0.05  # Max 5% of portfolio per position (more diversified)
  max_portfolio_risk: 0.02  # Max 2% daily portfolio risk
  stop_loss_pct: 0.05  # 5% stop loss
  take_profit_pct: 0.15  # 15% take profit
  max_open_positions: 20  # Allow more positions for diversification

backtest:
  start_date: "2020-01-01"
  end_date: "2025-01-01"
  initial_capital: 50000.0
  commission_pct: 0.0  # Alpaca is commission-free

monitoring:
  alerts_enabled: false
  slack_webhook: ""
  telegram_token: ""
  telegram_chat_id: ""

llm:
  provider: claude           # claude or openai
  model: null                # null uses provider default (claude-sonnet-4, gpt-4o)
  temperature: 0.3           # Lower = more deterministic
  prompt_version: latest     # latest, best, v1, v2, etc.
  lookback_days: 30          # Days of historical data for context
  include_news: true         # Include news headlines in LLM context
  # API keys should be set via environment variables:
  # ANTHROPIC_API_KEY, OPENAI_API_KEY
