[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autostock"
version = "0.1.0"
description = "Automated stock trading system for US markets (NYSE/NASDAQ)"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.21.0",
    "yfinance>=0.2.30",
    "ta>=0.11.0",
    "quantstats>=0.0.62",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "apscheduler>=3.10.0",
    "tzdata>=2024.1",  # IANA tz database for zoneinfo (US/Eastern cron schedules)
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
    "numpy>=1.25.0",
    "anthropic>=0.18.0",
    "openai>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
autostock = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
